<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwint – wejście</title>
    <link rel="stylesheet" href="wejsciowa.css">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
</head>
<body>

    <div class="bg-layer" aria-hidden="true"></div>

    <div class="stage" id="stage">
        <div class="container" id="mainContainer">

            <div class="black-bar" id="blackBar"></div>

            <img class="side-left"  src="asset/side.webp" alt="">
            <img class="side-right" src="asset/side.webp" alt="">

            <!-- Logo + menu pod spodem (nie na logo) -->
            <div class="top-stack">
                <img id="gwentLogo" class="logo" src="asset/gwint_en.webp" alt="Gwint">
                <nav class="menu">
                    <button type="button" class="menu-btn" id="btnPlay">GRAJ</button>
                    <button type="button" class="menu-btn" id="btnSettings">USTAWIENIA</button>
                    <button type="button" class="menu-btn" id="btnInfo">INFO</button>
                </nav>
            </div>

            <!-- Ikony: 2% od dołu, 20% od krawędzi kontenera, gap 5% -->
            <div class="icons">
                <button type="button" class="icon-btn" id="iconDiscord">
                    <img src="asset/discord.webp" alt="Discord">
                </button>
                <button type="button" class="icon-btn" id="iconFix">
                    <img src="asset/fix.webp" alt="Fix">
                </button>
                <button type="button" class="icon-btn" id="iconBug">
                    <img src="asset/bug.webp" alt="Bug">
                </button>
                <button type="button" class="icon-btn" id="iconLang">
                    <img src="asset/lang.webp" alt="Lang">
                </button>
            </div>

        </div>
    </div>

    <button type="button" id="versionBadge" class="version-badge" title="Changelog">
        <span id="versionDate">—</span>
        <span class="version-sep">·</span>
        <span id="versionNum">—</span>
    </button>

    <div id="changelogModal" class="modal-overlay" hidden>
        <div class="modal-panel">
            <button type="button" class="modal-close" id="changelogClose" aria-label="Zamknij">×</button>
            <h2 class="modal-title">Changelog</h2>
            <div id="changelogBody" class="modal-body"></div>
        </div>
    </div>

    <script src="changelog.js"></script>
    <script src="wejsciowa.js"></script>
</body>
</html>
