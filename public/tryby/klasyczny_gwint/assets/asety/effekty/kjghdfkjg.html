<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potężny Generator Szronu HD</title>
    <style>
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            gap: 25px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .sidebar {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 340px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 1px solid #333;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        label span {
            color: #00cbc6;
            font-family: monospace;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #00cbc6;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        button {
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: background 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-start { background-color: #00cbc6; color: #111; }
        .btn-start:hover { background-color: #00a8a5; }
        .btn-stop { background-color: #ff5252; color: white; }
        .btn-stop:hover { background-color: #ff1a1a; }
        .btn-download { background-color: #333; color: white; border: 1px solid #555; }
        .btn-download:hover { background-color: #444; }
        
        #canvasContainer {
            border: 2px dashed #444;
            background-image: linear-gradient(45deg, #090909 25%, transparent 25%), linear-gradient(-45deg, #090909 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #090909 75%), linear-gradient(-45deg, transparent 75%, #090909 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3 style="margin: 0 0 5px 0; color: #00cbc6;">Ustawienia Szronu</h3>
        
        <div class="control-group">
            <label>Liczba głównych ramion: <span id="val-ramiona">6</span></label>
            <input type="range" id="param-ramiona" min="3" max="48" value="6" oninput="updateLabel('ramiona')">
        </div>

        <div class="control-group">
            <label>Maks. długość ramienia (px): <span id="val-dlugosc">340</span></label>
            <input type="range" id="param-dlugosc" min="50" max="800" value="340" oninput="updateLabel('dlugosc')">
        </div>

        <div class="control-group">
            <label>Grubość początkowa linii: <span id="val-grubosc">6</span></label>
            <input type="range" id="param-grubosc" min="1" max="40" step="0.5" value="6" oninput="updateLabel('grubosc')">
        </div>

        <div class="control-group">
            <label>Zanikanie grubości (0% = brak): <span id="val-spadek">0.4%</span></label>
            <input type="range" id="param-spadek" min="0" max="15" step="0.05" value="0.4" oninput="updateLabel('spadek')">
        </div>

        <div class="control-group">
            <label>Gęstość kryształów (szansa %): <span id="val-gestosc">98%</span></label>
            <input type="range" id="param-gestosc" min="5" max="100" value="98" oninput="updateLabel('gestosc')">
        </div>

        <div class="control-group">
            <label>Zachowanie grubości odnóg (%): <span id="val-odnogimasa">94%</span></label>
            <input type="range" id="param-odnogimasa" min="10" max="100" value="94" oninput="updateLabel('odnogimasa')">
        </div>

        <div class="control-group">
            <label>Szybkość rysowania (opóźnienie ms): <span id="val-speed">15</span></label>
            <input type="range" id="param-speed" min="0" max="150" value="15" oninput="updateLabel('speed')">
        </div>

        <div class="buttons">
            <button class="btn-start" onclick="generujSzron()">Generuj masywny szron</button>
            <button class="btn-stop" onclick="stopGenerowania()">STOP</button>
            <button class="btn-download" onclick="pobierzPNG()">Pobierz jako PNG</button>
        </div>
    </div>

    <div class="main-content">
        <div id="canvasContainer">
            <canvas id="canvasSzron" width="1000" height="1000"></canvas>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('canvasSzron');
        const ctx = canvas.getContext('2d');
        
        let aktywneAnimacje = [];
        let czyZatrzymano = false;

        function updateLabel(id) {
            let val = document.getElementById('param-' + id).value;
            if (id === 'spadek' || id === 'gestosc' || id === 'odnogimasa') val += '%';
            document.getElementById('val-' + id).innerText = val;
        }

        function stopGenerowania() {
            czyZatrzymano = true;
            aktywneAnimacje.forEach(timeoutId => clearTimeout(timeoutId));
            aktywneAnimacje = [];
        }

        function generujSzron() {
            stopGenerowania();
            czyZatrzymano = false;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const ramiona = parseInt(document.getElementById('param-ramiona').value);
            const maxDlugosc = parseInt(document.getElementById('param-dlugosc').value);
            const gruboscStartowa = parseFloat(document.getElementById('param-grubosc').value);

            for (let i = 0; i < ramiona; i++) {
                const kat = (Math.PI * 2 / ramiona) * i;
                rysujRamieGlowne(centerX, centerY, kat, maxDlugosc, gruboscStartowa);
            }
        }

        function czyKolizjaZLodem(x, y, r) {
            try {
                const imgData = ctx.getImageData(x - r, y - r, r * 2, r * 2);
                const data = imgData.data;
                for (let i = 3; i < data.length; i += 4) {
                    if (data[i] > 50) return true;
                }
            } catch (e) {
                return false;
            }
            return false;
        }

        function rysujRamieGlowne(startX, startY, kat, dlugoscPozostala, grubosc) {
            if (czyZatrzymano || dlugoscPozostala <= 0) return;

            const krok = 8; 
            const nowyX = startX + Math.cos(kat) * krok;
            const nowyY = startY + Math.sin(kat) * krok;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(nowyX, nowyY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.96)';
            ctx.lineWidth = grubosc;
            ctx.lineCap = 'round';
            ctx.stroke();

            const szansaNaOdnoge = parseInt(document.getElementById('param-gestosc').value) / 100;
            const masaOdnogiMnoznik = parseInt(document.getElementById('param-odnogimasa').value) / 100;

            if (Math.random() < szansaNaOdnoge && dlugoscPozostala > 15) {
                const dlugoscOdnogi = dlugoscPozostala * 0.7;
                const gruboscOdnogi = Math.max(0.8, grubosc * masaOdnogiMnoznik);
                
                rysujOdnogeBoczna(nowyX, nowyY, kat + Math.PI / 3, dlugoscOdnogi, gruboscOdnogi, true);
                rysujOdnogeBoczna(nowyX, nowyY, kat - Math.PI / 3, dlugoscOdnogi, gruboscOdnogi, true);
            }

            const procentSpadku = parseFloat(document.getElementById('param-spadek').value) / 100;
            const nastepnaGrubosc = Math.max(1.0, grubosc * (1 - procentSpadku));

            const speed = parseInt(document.getElementById('param-speed').value);
            const timeoutId = setTimeout(() => {
                rysujRamieGlowne(nowyX, nowyY, kat, dlugoscPozostala - krok, nastepnaGrubosc);
            }, speed);

            aktywneAnimacje.push(timeoutId);
        }

        function rysujOdnogeBoczna(startX, startY, kat, dlugoscPozostala, grubosc, pierwszyKrok = false) {
            if (czyZatrzymano || dlugoscPozostala <= 0) return;

            const krok = 6;
            const nowyX = startX + Math.cos(kat) * krok;
            const nowyY = startY + Math.sin(kat) * krok;

            // Blokowanie nakładania się: sprawdzamy obszar przed postawieniem linii
            if (!pierwszyKrok && czyKolizjaZLodem(nowyX, nowyY, 2)) return; 

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(nowyX, nowyY);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + (Math.random() * 0.12 + 0.83) + ')';
            ctx.lineWidth = grubosc;
            ctx.lineCap = 'round';
            ctx.stroke();

            const szansaNaOdnoge = parseInt(document.getElementById('param-gestosc').value) / 100;
            const masaOdnogiMnoznik = parseInt(document.getElementById('param-odnogimasa').value) / 100;

            if (Math.random() < (szansaNaOdnoge * 0.5) && dlugoscPozostala > 20) {
                rysujOdnogeBoczna(nowyX, nowyY, kat + Math.PI / 3, dlugoscPozostala * 0.52, grubosc * masaOdnogiMnoznik);
                rysujOdnogeBoczna(nowyX, nowyY, kat - Math.PI / 3, dlugoscPozostala * 0.52, grubosc * masaOdnogiMnoznik);
            }

            const procentSpadku = parseFloat(document.getElementById('param-spadek').value) / 100;
            const nastepnaGrubosc = Math.max(0.7, grubosc * (1 - procentSpadku * 1.3));

            const speed = parseInt(document.getElementById('param-speed').value);
            const timeoutId = setTimeout(() => {
                rysujOdnogeBoczna(nowyX, nowyY, kat, dlugoscPozostala - krok, nastepnaGrubosc, false);
            }, Math.max(1, speed - 4));

            aktywneAnimacje.push(timeoutId);
        }

        function pobierzPNG() {
            const link = document.createElement('a');
            link.download = 'potezny_szron_hd.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = function() {
            generujSzron();
        };
    </script>
</body>
</html>
